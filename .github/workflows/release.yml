name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          swift format lint --recursive --strict Sources Tests Package.swift
          bash -n scripts/*.sh packaging/*.command
          make test
          make test-full
      - name: Package
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Xeneon-Touch-*.zip \
            dist/SHA256SUMS \
            --generate-notes \
            --title "Xeneon Touch ${GITHUB_REF_NAME}"
